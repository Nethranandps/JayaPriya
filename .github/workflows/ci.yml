name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check the health file made it into the build
        run: test -f dist/health.json && grep -q '"ok"' dist/health.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Render
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Trigger the Render deploy hook
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set (Render → service → Settings → Deploy Hook)."
            exit 1
          fi
          response=$(curl -fsS -X POST "$HOOK")
          echo "$response"
          echo "deploy_id=$(echo "$response" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Wait for Render to report the deploy live
        if: steps.hook.outputs.deploy_id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.hook.outputs.deploy_id }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "RENDER_API_KEY / RENDER_SERVICE_ID not set; skipping deploy status polling."
            exit 0
          fi
          for i in $(seq 1 60); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) echo "::error::Render deploy ended with status $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the Render deploy"; exit 1

      - name: Post-deploy health check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL repository variable not set; skipping health check."
            exit 0
          fi
          for i in $(seq 1 30); do
            body=$(curl -fsS "$SITE_URL/healthz" || true)
            if echo "$body" | grep -q '"ok"'; then
              echo "Healthy: $body"; exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL/healthz did not report ok"; exit 1
